<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bl1zzen's rom vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root {
            --md-sys-color-background: #FCF8FF;
            --md-sys-color-on-background: #1D1B20;
            --md-sys-color-surface: #FCF8FF;
            --md-sys-color-surface-container-low: #F6F2FA;
            --md-sys-color-surface-container: #F1ECF4;
            --md-sys-color-surface-container-high: #EBE6EE;
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            line-height: 1.5;
            padding: 24px 16px 64px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 820px;
        }

        header {
            text-align: center;
            margin: 24px 0 36px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: var(--md-sys-color-on-primary-container);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--md-sys-color-outline);
            font-size: 15px;
            margin-top: 6px;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 28px;
        }

        .search-bar {
            width: 100%;
            height: 56px;
            background-color: var(--md-sys-color-surface-container-high);
            border: 2px solid transparent;
            border-radius: 28px;
            padding: 0 52px;
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            color: var(--md-sys-color-on-background);
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            outline: none;
        }

        .search-bar::placeholder {
            color: var(--md-sys-color-outline);
        }

        .search-bar:focus {
            background-color: var(--md-sys-color-surface-container-low);
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 4px 12px rgba(103, 80, 164, 0.12);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--md-sys-color-on-secondary-container);
            pointer-events: none;
        }

        .clear-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--md-sys-color-outline);
            cursor: pointer;
            display: none;
            padding: 6px;
            border-radius: 50%;
        }

        .clear-btn:hover {
            background-color: rgba(29, 27, 32, 0.08);
        }

        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 8px;
            font-size: 13px;
            color: var(--md-sys-color-outline);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-card {
            background-color: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
        }

        .file-card:hover {
            background-color: var(--md-sys-color-surface-container);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(103, 80, 164, 0.08);
        }

        .file-left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .file-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-info {
            min-width: 0;
        }

        .file-name {
            font-weight: 500;
            font-size: 16px;
            color: var(--md-sys-color-on-background);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-details {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 13px;
            color: var(--md-sys-color-outline);
        }

        .ext-chip {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            flex-shrink: 0;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .download-btn:hover {
            background-color: #583E94;
            box-shadow: 0 2px 6px rgba(103, 80, 164, 0.3);
        }

        .download-btn .material-symbols-rounded {
            font-size: 20px;
        }

        .status-box {
            text-align: center;
            padding: 48px 20px;
            background-color: var(--md-sys-color-surface-container-low);
            border-radius: 24px;
            color: var(--md-sys-color-outline);
        }

        .loader {
            width: 36px;
            height: 36px;
            border: 3px solid var(--md-sys-color-primary-container);
            border-top-color: var(--md-sys-color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .file-card {
                flex-direction: column;
                align-items: stretch;
            }
            .download-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="badge">
            <span class="material-symbols-rounded" style="font-size: 16px;">android</span>
            <span>Firmware & GSI Repository</span>
        </div>
        <h1>Bl1zzen's rom vault</h1>
        <p class="subtitle">Custom ROMs, GSI images, recoveries & flashable zips</p>
    </header>

    <div class="search-wrapper">
        <span class="material-symbols-rounded search-icon">search</span>
        <input type="text" id="searchInput" class="search-bar" placeholder="Поиск по названию, устройству (santoni, mido, m01q...) или формату...">
        <button id="clearBtn" class="clear-btn" title="Очистить">
            <span class="material-symbols-rounded">close</span>
        </button>
    </div>

    <div class="meta-bar">
        <span id="repoLabel">Сканирование репозитория...</span>
        <span id="countLabel"></span>
    </div>

    <div id="fileList" class="file-list">
        <div class="status-box">
            <div class="loader"></div>
            <p>Загружаем список прошивок из GitHub...</p>
        </div>
    </div>
</div>

<script>
    const MANUAL_OWNER = 'akitaandcaxap';
    const MANUAL_REPO = 'bl1zzen-rom-vault';
    const EXTERNAL_JSON_PATH = './external-files.json';

    const ALLOWED_EXTENSIONS = [
        'img', 'zip', 'tar', 'md5', 'bin', 'lz4', 'xz', 'gz', 'apk', 'sh', 'bat', 'payload'
    ];

    let allFiles = [];

    function detectRepoInfo() {
        if (MANUAL_OWNER && MANUAL_REPO) {
            return { owner: MANUAL_OWNER, repo: MANUAL_REPO };
        }

        const host = window.location.hostname;
        const pathParts = window.location.pathname.split('/').filter(Boolean);

        if (host.endsWith('.github.io')) {
            const owner = host.split('.')[0];
            const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
            return { owner, repo };
        }

        return { owner: 'akitaandcaxap', repo: 'bl1zzen-rom-vault' };
    }

    function formatBytes(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function getFileIcon(ext) {
        if (['img', 'bin', 'lz4', 'payload'].includes(ext)) return 'album';
        if (['zip', 'tar', 'md5', 'xz', 'gz'].includes(ext)) return 'folder_zip';
        if (ext === 'apk') return 'android';
        return 'terminal';
    }

    async function fetchExternalFiles() {
        try {
            const res = await fetch(`${EXTERNAL_JSON_PATH}?t=${Date.now()}`);
            if (!res.ok) return [];
            const data = await res.json();
            if (!Array.isArray(data)) return [];

            return data
                .filter(item => item && item.name && item.downloadUrl)
                .map(item => {
                    const ext = (item.ext || (item.name.includes('.') ? item.name.split('.').pop() : '')).toLowerCase();
                    return {
                        name: item.name,
                        path: item.path || item.name,
                        folder: item.folder || 'External',
                        ext,
                        size: item.size || 0,
                        downloadUrl: item.downloadUrl
                    };
                })
                .filter(file => !file.ext || ALLOWED_EXTENSIONS.includes(file.ext));
        } catch (_) {
            return [];
        }
    }

    async function fetchRepoFiles() {
        const { owner, repo } = detectRepoInfo();
        const repoLabel = document.getElementById('repoLabel');
        repoLabel.textContent = `${owner} / ${repo}`;

        try {
            const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
            if (!repoRes.ok) throw new Error('Репозиторий не найден или превышен лимит GitHub API');
            const repoData = await repoRes.json();
            const defaultBranch = repoData.default_branch || 'main';

            const [treeRes, relRes, externalFiles] = await Promise.all([
                fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${defaultBranch}?recursive=1`),
                fetch(`https://api.github.com/repos/${owner}/${repo}/releases`),
                fetchExternalFiles()
            ]);

            if (!treeRes.ok) throw new Error('Не удалось прочитать список файлов репозитория');
            const treeData = await treeRes.json();

            const repoFiles = (treeData.tree || [])
                .filter(item => item.type === 'blob')
                .map(item => {
                    const name = item.path.split('/').pop();
                    const folder = item.path.includes('/') ? item.path.substring(0, item.path.lastIndexOf('/')) : '';
                    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
                    const downloadUrl = `https://github.com/${owner}/${repo}/raw/${defaultBranch}/${encodeURI(item.path)}`;

                    return {
                        name,
                        path: item.path,
                        folder,
                        ext,
                        size: item.size,
                        downloadUrl
                    };
                })
                .filter(file => ALLOWED_EXTENSIONS.includes(file.ext));

            const releaseFiles = [];
            if (relRes.ok) {
                const releases = await relRes.json();
                for (const release of releases) {
                    for (const asset of (release.assets || [])) {
                        const name = asset.name;
                        const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
                        if (!ALLOWED_EXTENSIONS.includes(ext)) continue;

                        releaseFiles.push({
                            name,
                            path: `${release.tag_name}/${name}`,
                            folder: `Release: ${release.tag_name}`,
                            ext,
                            size: asset.size,
                            downloadUrl: asset.browser_download_url
                        });
                    }
                }
            }

            allFiles = [...externalFiles, ...releaseFiles, ...repoFiles];
            renderFiles(allFiles);

        } catch (err) {
            document.getElementById('fileList').innerHTML = `
                <div class="status-box">
                    <span class="material-symbols-rounded" style="font-size: 40px; color: var(--md-sys-color-primary); margin-bottom: 8px;">error</span>
                    <p style="font-weight: 500; color: var(--md-sys-color-on-background);">Ошибка сканирования</p>
                    <p style="font-size: 14px; margin-top: 4px;">${err.message}</p>
                </div>
            `;
        }
    }

    function renderFiles(files) {
        const listEl = document.getElementById('fileList');
        const countLabel = document.getElementById('countLabel');
        countLabel.textContent = `Найдено файлов: ${files.length}`;

        if (files.length === 0) {
            listEl.innerHTML = `
                <div class="status-box">
                    <span class="material-symbols-rounded" style="font-size: 40px; margin-bottom: 8px;">inventory_2</span>
                    <p>Ничего не найдено</p>
                </div>
            `;
            return;
        }

        listEl.innerHTML = files.map(file => `
            <div class="file-card">
                <div class="file-left">
                    <div class="file-icon-box">
                        <span class="material-symbols-rounded">${getFileIcon(file.ext)}</span>
                    </div>
                    <div class="file-info">
                        <div class="file-name" title="${file.name}">${file.name}</div>
                        <div class="file-details">
                            <span class="ext-chip">.${file.ext}</span>
                            <span>${formatBytes(file.size)}</span>
                            ${file.folder ? `<span>• 📁 ${file.folder}</span>` : ''}
                        </div>
                    </div>
                </div>
                <a href="${file.downloadUrl}" class="download-btn" download="${file.name}">
                    <span class="material-symbols-rounded">download</span>
                    <span>Скачать</span>
                </a>
            </div>
        `).join('');
    }

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        clearBtn.style.display = query ? 'block' : 'none';

        const filtered = allFiles.filter(file => 
            file.name.toLowerCase().includes(query) || 
            file.folder.toLowerCase().includes(query) ||
            file.ext.includes(query)
        );
        renderFiles(filtered);
    });

    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        renderFiles(allFiles);
        searchInput.focus();
    });

    fetchRepoFiles();
</script>

</body>
</html>
